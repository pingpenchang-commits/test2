<!DOCTYPE html>
<html lang="zh-TW">

<head>

   <meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>三久太陽能</title>


<!-- LINE LIFF SDK -->
<script
    charset="utf-8"
    src="https://static.line-scdn.net/liff/edge/2/sdk.js">
</script>


<style>

    body {

        font-family:
            -apple-system,
            BlinkMacSystemFont,
            sans-serif;

        background: #f5f5f5;

        padding: 20px;
    }


    .box {

        background: white;

        padding: 20px;

        border-radius: 12px;

        max-width: 400px;

        margin: 0 auto;

        box-shadow:
            0 4px 10px
            rgba(0,0,0,0.08);
    }


    .logo {

        text-align: center;

        margin-bottom: 20px;
    }


    .logo img {

        width: 100%;

        height: auto;
    }


    .history-title {

        font-weight: bold;

        margin-bottom: 10px;

        color: #333;

        font-size: 15px;
    }


    label {

        display: block;

        margin-top: 12px;

        margin-bottom: 5px;

        color: #333;

        font-size: 14px;

        font-weight: bold;
    }


    input[type="text"],
    input[type="tel"],
    input[type="date"] {

        width: 100%;

        box-sizing: border-box;

        padding: 10px;

        border: 1px solid #ddd;

        border-radius: 6px;

        font-size: 15px;

        background: #fff;
    }


    input[type="file"] {

        width: 100%;

        box-sizing: border-box;

        padding: 10px;

        background: #fafafa;

        border: 1px dashed #ccc;

        border-radius: 6px;
    }


    button {

        width: 100%;

        box-sizing: border-box;

        margin-top: 15px;

        padding: 12px;

        background: #003C9D;

        color: white;

        border: none;

        font-weight: bold;

        font-size: 16px;

        border-radius: 6px;

        cursor: pointer;
    }


    button:disabled {

        background: #999;

        cursor: not-allowed;
    }


    .gallery {

        display: flex;

        flex-wrap: wrap;

        gap: 10px;

        margin-bottom: 20px;

        min-height: 50px;
    }


    .gallery img {

        width: 100%;

        height: auto;

        object-fit: contain;

        background: #f5f5f5;

        border-radius: 6px;

        border: 1px solid #ddd;

        cursor: pointer;
    }


    .status {

        text-align: center;

        color: #666;

        font-size: 14px;

        margin-top: 10px;
    }


    /* =========================================
       維修歷史紀錄
    ========================================= */

    #repairHistory {

        margin-top: 10px;
    }


    .repair-card {

        background: #f8f9fa;

        border: 1px solid #e5e5e5;

        border-radius: 8px;

        padding: 12px;

        margin-bottom: 10px;
    }


    .repair-date {

        color: #003C9D;

        font-weight: bold;

        font-size: 15px;

        margin-bottom: 8px;
    }


    .repair-row {

        margin-top: 6px;

        font-size: 14px;

        color: #444;

        line-height: 1.5;
    }


    .repair-label {

        font-weight: bold;

        color: #333;
    }


    .no-repair {

        color: #888;

        text-align: center;

        padding: 15px 5px;

        font-size: 14px;
    }


    .repair-form {

        margin-top: 20px;

        padding-top: 15px;

        border-top: 1px solid #eee;
    }

</style>
