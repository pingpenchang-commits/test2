<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的專屬相簿</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f5; padding: 20px; }
        .box { background: white; padding: 20px; border-radius: 12px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        h3 { text-align: center; color: #06C755; margin-top: 0; }
        .history-title { font-weight: bold; margin-bottom: 10px; color: #333; font-size: 15px; }
        .gallery { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; min-height: 50px; }
        .gallery img { width: 100%; height: auto; object-fit: contain; border-radius: 6px; border: 1px solid #ddd; }
        input[type="file"] { width: 100%; box-sizing: border-box; padding: 10px; background: #fafafa; border: 1px dashed #ccc; border-radius: 6px; }
        button { width: 100%; box-sizing: border-box; margin-top: 15px; padding: 12px; background: #06C755; color: white; border: none; font-weight: bold; font-size: 16px; border-radius: 6px; cursor: pointer; }
        button:disabled { background: #999; }
    </style>
</head>
<body>

<div class="box">
    <h3>📸 您的款式相簿</h3>
    
    <div class="history-title">您過去上傳的照片：</div>
    <div id="gallery" class="gallery">正在讀取 LINE 身份中...</div>
    
    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
    
    <div class="history-title">新增參考照片：</div>
    <input type="file" id="fileInput" accept="image/*">
    <button id="uploadBtn" onclick="uploadPhoto()">確認上傳照片</button>
</div>

<script>
    // ⚠️ 1. 請在此填入您的 Google Apps Script 網頁應用程式網址 (結尾必須是 /exec)
    const GOOGLE_API_URL = "https://script.google.com/macros/s/AKfycbx-JA2ssZD6FQrVArpG6COxzZPI4-_O6Rd1bqN70MdXKMiKFQhJNleUKslqzdJpYSfL/exec"; 
    // ⚠️ 2. 請在此填入您的 LINE LIFF ID
    const MY_LIFF_ID = "2011256691-2xjeJiKc"; 
    
    let user_id = "";

    // 初始化 LINE LIFF 並強制登入
async function initLIFF() {
    const gallery = document.getElementById("gallery");

    try {
        gallery.innerText = "正在連線 LINE...";

        await liff.init({
            liffId: MY_LIFF_ID
        });

        if (!liff.isLoggedIn()) {
            gallery.innerText = "正在開啟 LINE 登入...";

            liff.login({
                redirectUri: window.location.href
            });

            return;
        }

        const profile = await liff.getProfile();

        console.log("LINE Profile:", profile);

        if (!profile || !profile.userId) {
            throw new Error("無法取得 LINE User ID");
        }

        user_id = profile.userId;

        console.log("LINE User ID:", user_id);

        gallery.innerText = "正在讀取您的歷史照片...";

        fetchHistoryPhotos(user_id);

    } catch (error) {
        console.error("LIFF Error:", error);

        gallery.innerText =
            "LINE 身份讀取失敗：" +
            (error.message || error);
    }
}

initLIFF();

    // 撈取歷史紀錄 (GET)
    function fetchHistoryPhotos(uid) {
        fetch(`${GOOGLE_API_URL}?action=getPhotos&userId=${uid}`)
            .then(res => res.json())
            .then(data => {
                const gallery = document.getElementById('gallery');
                gallery.innerHTML = "";
                if (!data || data.length === 0) {
                    gallery.innerText = "尚無歷史照片紀錄";
                } else {
                    data.forEach(url => {
                        const img = document.createElement('img');
                        img.src = url;
                        gallery.appendChild(img);
                    });
                }
            }).catch(err => {
                document.getElementById('gallery').innerText = "無法載入雲端相簿紀錄";
            });
    }

    // 上傳新照片 (POST)
    function uploadPhoto() {
        const fileInput = document.getElementById('fileInput');
        if (fileInput.files.length === 0) return alert("請先選擇照片");
        if (!user_id) return alert("尚未讀取到您的 LINE 帳號身份，請重新整理網頁");

        const btn = document.getElementById('uploadBtn');
        btn.innerText = "照片永久保存中...請勿關閉";
        btn.disabled = true;

        const file = fileInput.files[0]; // ✨ 核心修正：明確抓取第一個檔案項目
        const reader = new FileReader();
        
        reader.readAsDataURL(file);
        reader.onload = function () {
            // ✨ 核心修正：將完整的 Base64 字串正確分離出純資料內容
            const base64Parts = reader.result.split(',');
            const base64String = base64Parts[1]; 
            
            const payload = {
                action: "upload",
                userId: user_id,
                filename: file.name,
                mimeType: file.type,
                data: base64String
            };

            // ✨ 將 fetch 動作嚴格鎖在 reader.onload 裡面執行，確保資料轉換完畢才發射
            fetch(GOOGLE_API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === "success") {
                    alert("上傳成功！照片已永久保存。");
                    location.reload();
                } else {
                    alert("後端儲存失敗原因：" + res.message);
                    resetButton();
                }
            }).catch(err => {
                alert("網路傳送被攔截，請確認後端部署設定是否為「所有人」");
                resetButton();
            });
        };
        
        function resetButton() {
            btn.innerText = "確認上傳照片";
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
