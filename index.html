<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>三久太陽能</title>

<script
  charset="utf-8"
  src="https://static.line-scdn.net/liff/edge/2/sdk.js">
</script>


<style>

* {
  box-sizing: border-box;
}

body {

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;

  background: #f5f5f5;

  padding: 20px;

  margin: 0;
}


.box {

  background: white;

  padding: 20px;

  border-radius: 12px;

  max-width: 500px;

  margin: 0 auto;

  box-shadow:
    0 4px 10px
    rgba(0,0,0,0.08);
}


.logo {

  text-align: center;

  margin-bottom: 20px;
}


.logo img {

  width: 100%;

  height: auto;
}


.section-title {

  font-weight: bold;

  margin-bottom: 10px;

  color: #333;

  font-size: 17px;
}


label {

  display: block;

  margin-top: 12px;

  margin-bottom: 5px;

  color: #333;

  font-size: 14px;

  font-weight: bold;
}


input,
textarea {

  width: 100%;

  padding: 11px;

  border:
    1px solid #ddd;

  border-radius: 6px;

  font-size: 15px;

  background: #fff;
}


textarea {

  min-height: 90px;

  resize: vertical;
}


input[type="file"] {

  padding: 10px;

  background: #fafafa;

  border:
    1px dashed #ccc;
}


button {

  width: 100%;

  margin-top: 15px;

  padding: 12px;

  background: #003C9D;

  color: white;

  border: none;

  font-weight: bold;

  font-size: 16px;

  border-radius: 6px;

  cursor: pointer;
}


button:disabled {

  background: #999;

}


hr {

  border: 0;

  border-top:
    1px solid #eee;

  margin: 25px 0;
}


.gallery {

  display: flex;

  flex-wrap: wrap;

  gap: 10px;

  margin-bottom: 10px;
}


.gallery img {

  width: 100%;

  border-radius: 6px;

  border:
    1px solid #ddd;
}


.repair-card {

  background: #f8f9fb;

  border:
    1px solid #e5e5e5;

  border-radius: 8px;

  padding: 12px;

  margin-bottom: 10px;
}


.repair-date {

  color: #003C9D;

  font-weight: bold;

  margin-bottom: 6px;
}


.repair-item {

  font-weight: bold;

  margin-bottom: 5px;
}


.repair-content {

  color: #555;

  font-size: 14px;

  white-space: pre-wrap;
}


.status {

  text-align: center;

  color: #666;

  font-size: 14px;

  margin-top: 10px;
}

</style>

</head>


<body>


<div class="box">


  <div class="logo">

    <img
      src="https://i.ibb.co/chRL8DY0/logo.jpg"
      alt="Logo"
    >

  </div>


  <!-- ==================================================
       客戶資料
  =================================================== -->

  <div class="section-title">
    客戶資料
  </div>


  <label>
    姓名
  </label>

  <input
    type="text"
    id="customerName"
    placeholder="請輸入姓名"
  >


  <label>
    電話
  </label>

  <input
    type="tel"
    id="phone"
    placeholder="請輸入電話"
  >


  <label>
    地址
  </label>

  <input
    type="text"
    id="address"
    placeholder="請輸入地址"
  >


  <label>
    機型
  </label>

  <input
    type="text"
    id="model"
    placeholder="請輸入機型"
  >


  <label>
    安裝日期
  </label>

  <input
    type="date"
    id="installDate"
  >


  <button
    id="saveCustomerBtn"
    onclick="saveCustomer()"
  >
    儲存客戶資料
  </button>


  <hr>


  <!-- ==================================================
       歷史照片
  =================================================== -->

  <div class="section-title">
    歷史照片
  </div>


  <div
    id="gallery"
    class="gallery"
  >
    正在讀取 LINE 身份中...
  </div>


  <hr>


  <!-- ==================================================
       上傳照片
  =================================================== -->

  <div class="section-title">
    新增參考照片
  </div>


  <input
    type="file"
    id="fileInput"
    accept="image/*"
  >


  <button
    id="uploadBtn"
    onclick="uploadPhoto()"
  >
    確認上傳照片
  </button>


  <hr>


  <!-- ==================================================
       維修歷史
  =================================================== -->

  <div class="section-title">
    維修歷史紀錄
  </div>


  <div id="repairHistory">

    正在讀取維修紀錄...

  </div>


  <hr>


  <!-- ==================================================
       新增維修紀錄
  =================================================== -->

  <div class="section-title">
    新增維修紀錄
  </div>


  <label>
    維修日期
  </label>

  <input
    type="date"
    id="repairDate"
  >


  <label>
    維修項目
  </label>

  <input
    type="text"
    id="repairType"
    placeholder="例如：熱水器漏水"
  >


  <label>
    維修內容
  </label>

  <textarea
    id="repairDescription"
    placeholder="請描述維修內容"
  ></textarea>


  <label>
    技師
  </label>

  <input
    type="text"
    id="repairTechnician"
    placeholder="技師姓名"
  >


  <label>
    費用
  </label>

  <input
    type="text"
    id="repairCost"
    placeholder="例如：1500"
  >


  <label>
    備註
  </label>

  <textarea
    id="repairNote"
    placeholder="其他備註"
  ></textarea>


  <button
    id="repairBtn"
    onclick="addRepair()"
  >
    新增維修紀錄
  </button>


  <div
    id="status"
    class="status"
  ></div>


</div>



<script>


// ======================================================
// 設定
// ======================================================

const GOOGLE_API_URL =
  "https://script.google.com/macros/s/AKfycbwsi-SWa-LZ_fc7gEjtNxkOSg-ZrkigDxol2SxfYD058epCl81ToMeAC4iXCTXAYFSb9Q/exec";


const MY_LIFF_ID =
  "2011256691-2xjeJiKc";


// ======================================================
// LINE User ID
// ======================================================

let user_id = "";


// ======================================================
// 初始化 LIFF
// ======================================================

async function initLIFF() {

  try {

    document.getElementById(
      "gallery"
    ).innerText =
      "正在連線 LINE...";


    await liff.init({

      liffId:
        MY_LIFF_ID

    });


    if (!liff.isLoggedIn()) {

      liff.login({

        redirectUri:
          window.location.href

      });

      return;
    }


    const profile =
      await liff.getProfile();


    if (
      !profile ||
      !profile.userId
    ) {

      throw new Error(
        "無法取得 LINE User ID"
      );
    }


    user_id =
      profile.userId;


    await loadCustomer();

    await fetchHistoryPhotos();

    await fetchRepairs();


  } catch (error) {

    console.error(error);


    document.getElementById(
      "gallery"
    ).innerText =
      "LINE 身份讀取失敗：" +
      error.message;
  }
}



// ======================================================
// 讀取客戶資料
// ======================================================

async function loadCustomer() {

  try {

    const response =
      await fetch(

        GOOGLE_API_URL +
        "?action=getCustomer" +
        "&userId=" +
        encodeURIComponent(
          user_id
        )

      );


    const data =
      await response.json();


    if (
      data.status ===
      "success" &&
      data.customer
    ) {

      document.getElementById(
        "customerName"
      ).value =
        data.customer.name || "";


      document.getElementById(
        "phone"
      ).value =
        data.customer.phone || "";


      document.getElementById(
        "address"
      ).value =
        data.customer.address || "";


      document.getElementById(
        "model"
      ).value =
        data.customer.model || "";


      document.getElementById(
        "installDate"
      ).value =
        data.customer.installDate || "";
    }


  } catch (error) {

    console.error(
      "載入客戶資料失敗",
      error
    );
  }
}



// ======================================================
// 儲存客戶
// ======================================================

async function saveCustomer() {

  if (!user_id) {

    alert(
      "尚未取得 LINE 身份"
    );

    return;
  }


  const name =
    document.getElementById(
      "customerName"
    ).value.trim();


  if (!name) {

    alert(
      "請輸入姓名"
    );

    return;
  }


  const btn =
    document.getElementById(
      "saveCustomerBtn"
    );


  btn.disabled = true;

  btn.innerText =
    "儲存中...";


  try {

    const payload = {

      action:
        "saveCustomer",

      userId:
        user_id,

      name:
        name,

      phone:
        document.getElementById(
          "phone"
        ).value.trim(),

      address:
        document.getElementById(
          "address"
        ).value.trim(),

      model:
        document.getElementById(
          "model"
        ).value.trim(),

      installDate:
        document.getElementById(
          "installDate"
        ).value

    };


    const response =
      await fetch(

        GOOGLE_API_URL,

        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify(
              payload
            )
        }
      );


    const data =
      await response.json();


    if (
      data.status ===
      "success"
    ) {

      alert(
        "客戶資料已成功儲存！"
      );

    } else {

      alert(
        data.message ||
        "儲存失敗"
      );
    }


  } catch (error) {

    console.error(error);

    alert(
      "無法連線到伺服器"
    );


  } finally {

    btn.disabled = false;

    btn.innerText =
      "儲存客戶資料";
  }
}



// ======================================================
// 讀取照片
// ======================================================

async function fetchHistoryPhotos() {

  const gallery =
    document.getElementById(
      "gallery"
    );


  try {

    const response =
      await fetch(

        GOOGLE_API_URL +
        "?action=getPhotos" +
        "&userId=" +
        encodeURIComponent(
          user_id
        )

      );


    const data =
      await response.json();


    gallery.innerHTML = "";


    if (
      !data ||
      data.length === 0
    ) {

      gallery.innerText =
        "尚無歷史照片";

      return;
    }


    data.forEach(
      function(photo) {

        const img =
          document.createElement(
            "img"
          );


        img.src =
          photo.url;


        img.loading =
          "lazy";


        gallery.appendChild(
          img
        );

      }
    );


  } catch (error) {

    console.error(error);

    gallery.innerText =
      "無法載入照片";
  }
}



// ======================================================
// 上傳照片
// ======================================================

function uploadPhoto() {

  const fileInput =
    document.getElementById(
      "fileInput"
    );


  if (
    fileInput.files.length === 0
  ) {

    alert(
      "請先選擇照片"
    );

    return;
  }


  if (!user_id) {

    alert(
      "尚未取得 LINE 身份"
    );

    return;
  }


  const file =
    fileInput.files[0];


  if (
    file.size >
    10 * 1024 * 1024
  ) {

    alert(
      "照片不能超過 10MB"
    );

    return;
  }


  const btn =
    document.getElementById(
      "uploadBtn"
    );


  btn.disabled = true;

  btn.innerText =
    "照片上傳中...";


  const reader =
    new FileReader();


  reader.readAsDataURL(
    file
  );


  reader.onload =
    async function() {

      try {

        const base64 =
          reader.result
            .split(",")[1];


        const payload = {

          action:
            "upload",

          userId:
            user_id,

          filename:
            file.name,

          mimeType:
            file.type,

          data:
            base64
        };


        const response =
          await fetch(

            GOOGLE_API_URL,

            {

              method:
                "POST",

              headers: {

                "Content-Type":
                  "text/plain;charset=utf-8"

              },

              body:
                JSON.stringify(
                  payload
                )
            }
          );


        const data =
          await response.json();


        if (
          data.status ===
          "success"
        ) {

          alert(
            "照片上傳成功！"
          );


          fileInput.value =
            "";


          await fetchHistoryPhotos();


        } else {

          alert(
            data.message ||
            "上傳失敗"
          );
        }


      } catch (error) {

        console.error(error);

        alert(
          "照片上傳失敗"
        );


      } finally {

        btn.disabled =
          false;

        btn.innerText =
          "確認上傳照片";
      }
    };
}



// ======================================================
// 讀取維修歷史
// ======================================================

async function fetchRepairs() {

  const container =
    document.getElementById(
      "repairHistory"
    );


  try {

    const response =
      await fetch(

        GOOGLE_API_URL +
        "?action=getRepairs" +
        "&userId=" +
        encodeURIComponent(
          user_id
        )

      );


    const data =
      await response.json();


    container.innerHTML =
      "";


    if (
      !data ||
      data.length === 0
    ) {

      container.innerText =
        "尚無維修紀錄";

      return;
    }


    data.forEach(
      function(repair) {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "repair-card";


        card.innerHTML =

          "<div class='repair-date'>" +
          escapeHtml(
            repair.repairDate
          ) +
          "</div>" +

          "<div class='repair-item'>" +
          escapeHtml(
            repair.type
          ) +
          "</div>" +

          "<div class='repair-content'>" +
          escapeHtml(
            repair.description
          ) +
          "</div>" +

          (
            repair.technician
              ? "<div>技師：" +
                escapeHtml(
                  repair.technician
                ) +
                "</div>"
              : ""
          ) +

          (
            repair.cost
              ? "<div>費用：" +
                escapeHtml(
                  repair.cost
                ) +
                "</div>"
              : ""
          ) +

          (
            repair.note
              ? "<div>備註：" +
                escapeHtml(
                  repair.note
                ) +
                "</div>"
              : ""
          );


        container.appendChild(
          card
        );

      }
    );


  } catch (error) {

    console.error(error);

    container.innerText =
      "無法載入維修紀錄";
  }
}



// ======================================================
// 新增維修紀錄
// ======================================================

async function addRepair() {

  if (!user_id) {

    alert(
      "尚未取得 LINE 身份"
    );

    return;
  }


  const repairDate =
    document.getElementById(
      "repairDate"
    ).value;


  const type =
    document.getElementById(
      "repairType"
    ).value.trim();


  const description =
    document.getElementById(
      "repairDescription"
    ).value.trim();


  const technician =
    document.getElementById(
      "repairTechnician"
    ).value.trim();


  const cost =
    document.getElementById(
      "repairCost"
    ).value.trim();


  const note =
    document.getElementById(
      "repairNote"
    ).value.trim();


  if (!repairDate) {

    alert(
      "請選擇維修日期"
    );

    return;
  }


  if (!type) {

    alert(
      "請輸入維修項目"
    );

    return;
  }


  const btn =
    document.getElementById(
      "repairBtn"
    );


  btn.disabled = true;

  btn.innerText =
    "儲存中...";


  try {

    const payload = {

      action:
        "addRepair",

      userId:
        user_id,

      repairDate:
        repairDate,

      type:
        type,

      description:
        description,

      technician:
        technician,

      cost:
        cost,

      note:
        note
    };


    const response =
      await fetch(

        GOOGLE_API_URL,

        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify(
              payload
            )
        }
      );


    const data =
      await response.json();


    if (
      data.status ===
      "success"
    ) {

      alert(
        "維修紀錄已新增！"
      );


      document.getElementById(
        "repairType"
      ).value = "";


      document.getElementById(
        "repairDescription"
      ).value = "";


      document.getElementById(
        "repairTechnician"
      ).value = "";


      document.getElementById(
        "repairCost"
      ).value = "";


      document.getElementById(
        "repairNote"
      ).value = "";


      await fetchRepairs();


    } else {

      alert(
        data.message ||
        "新增失敗"
      );
    }


  } catch (error) {

    console.error(error);

    alert(
      "無法連線到伺服器"
    );


  } finally {

    btn.disabled = false;

    btn.innerText =
      "新增維修紀錄";
  }
}



// ======================================================
// HTML 安全處理
// ======================================================

function escapeHtml(value) {

  return String(
    value || ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );
}



// ======================================================
// 啟動
// ======================================================

initLIFF();

</script>

</body>

</html>
