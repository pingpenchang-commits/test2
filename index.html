<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>三久太陽能</title>


    <!-- LINE LIFF SDK -->
    <script
        charset="utf-8"
        src="https://static.line-scdn.net/liff/edge/2/sdk.js">
    </script>


    <style>

        /* ==========================================
           基本頁面
        ========================================== */

        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                sans-serif;

            background: #f5f5f5;

            padding: 20px;

        }


        /* ==========================================
           主容器
        ========================================== */

        .box {

            background: white;

            padding: 20px;

            border-radius: 12px;

            max-width: 400px;

            margin: 0 auto;

            box-shadow:
                0 4px 10px
                rgba(0,0,0,0.08);

        }


        /* ==========================================
           Logo
        ========================================== */

        .logo {

            text-align: center;

            margin-bottom: 20px;

        }


        .logo img {

            width: 100%;

            height: auto;

        }


        /* ==========================================
           標題
        ========================================== */

        .history-title {

            font-weight: bold;

            margin-bottom: 10px;

            color: #333;

            font-size: 15px;

        }


        /* ==========================================
           表單 Label
        ========================================== */

        label {

            display: block;

            margin-top: 12px;

            margin-bottom: 5px;

            color: #333;

            font-size: 14px;

            font-weight: bold;

        }


        /* ==========================================
           輸入框
        ========================================== */

        input[type="text"],
        input[type="tel"],
        input[type="date"] {

            width: 100%;

            box-sizing: border-box;

            padding: 10px;

            border: 1px solid #ddd;

            border-radius: 6px;

            font-size: 15px;

            background: #fff;

        }


        /* ==========================================
           檔案選擇
        ========================================== */

        input[type="file"] {

            width: 100%;

            box-sizing: border-box;

            padding: 10px;

            background: #fafafa;

            border: 1px dashed #ccc;

            border-radius: 6px;

        }


        /* ==========================================
           按鈕
        ========================================== */

        button {

            width: 100%;

            box-sizing: border-box;

            margin-top: 15px;

            padding: 12px;

            background: #003C9D;

            color: white;

            border: none;

            font-weight: bold;

            font-size: 16px;

            border-radius: 6px;

            cursor: pointer;

        }


        button:disabled {

            background: #999;

            cursor: not-allowed;

        }


        /* ==========================================
           分隔線
        ========================================== */

        .divider {

            border: 0;

            border-top: 1px solid #eee;

            margin: 20px 0;

        }


        /* ==========================================
           照片區
        ========================================== */

        .gallery {

            display: flex;

            flex-wrap: wrap;

            gap: 10px;

            margin-bottom: 20px;

            min-height: 50px;

        }


        .gallery img {

            width: 100%;

            height: auto;

            object-fit: contain;

            background: #f5f5f5;

            border-radius: 6px;

            border: 1px solid #ddd;

        }


        /* ==========================================
           狀態文字
        ========================================== */

        .status {

            text-align: center;

            color: #666;

            font-size: 14px;

            margin-top: 10px;

        }


        /* ==========================================
           維修歷史
        ========================================== */

        #repairHistory {

            margin-top: 10px;

        }


        .repair-card {

            background: #f8f9fa;

            border: 1px solid #e5e5e5;

            border-radius: 8px;

            padding: 12px;

            margin-bottom: 10px;

        }


        .repair-date {

            color: #003C9D;

            font-weight: bold;

            font-size: 15px;

            margin-bottom: 8px;

        }


        .repair-row {

            margin-top: 6px;

            font-size: 14px;

            color: #444;

            line-height: 1.5;

        }


        .repair-label {

            font-weight: bold;

            color: #333;

        }


        .no-repair {

            color: #888;

            text-align: center;

            padding: 15px 5px;

            font-size: 14px;

        }


        /* ==========================================
           維修表單
        ========================================== */

        .repair-form {

            margin-top: 20px;

            padding-top: 15px;

            border-top: 1px solid #eee;

        }

    </style>

</head>


<body>


<div class="box">


    <!-- ==========================================
         Logo
    ========================================== -->

    <div class="logo">

        <img
            src="https://i.ibb.co/chRL8DY0/logo.jpg"
            alt="三久太陽能"
        >

    </div>



    <!-- ==========================================
         客戶資料
    ========================================== -->

    <div class="history-title">

        客戶資料

    </div>


    <label for="customerName">

        姓名

    </label>


    <input
        type="text"
        id="customerName"
        placeholder="請輸入姓名"
    >


    <label for="phone">

        電話

    </label>


    <input
        type="tel"
        id="phone"
        placeholder="請輸入電話"
    >


    <label for="address">

        地址

    </label>


    <input
        type="text"
        id="address"
        placeholder="請輸入地址"
    >


    <label for="model">

        機型

    </label>


    <input
        type="text"
        id="model"
        placeholder="請輸入機型"
    >


    <label for="installDate">

        安裝日期

    </label>


    <input
        type="date"
        id="installDate"
    >


    <button
        id="saveCustomerBtn"
        onclick="saveCustomer()"
    >

        儲存客戶資料

    </button>



    <hr class="divider">



    <!-- ==========================================
         維修歷史紀錄
    ========================================== -->

    <div class="history-title">

        維修歷史紀錄

    </div>


    <div id="repairHistory">

        正在讀取維修紀錄...

    </div>



    <!-- ==========================================
         新增維修紀錄
    ========================================== -->

    <div class="repair-form">

        <div class="history-title">

            新增維修紀錄

        </div>


        <label for="repairDate">

            維修日期

        </label>


        <input
            type="date"
            id="repairDate"
        >


        <label for="repairContent">

            維修內容

        </label>


        <input
            type="text"
            id="repairContent"
            placeholder="例如：更換集熱管、清洗水垢"
        >


        <label for="technician">

            維修人員

        </label>


        <input
            type="text"
            id="technician"
            placeholder="請輸入維修人員"
        >


        <label for="repairNote">

            備註

        </label>


        <input
            type="text"
            id="repairNote"
            placeholder="請輸入備註"
        >


        <button
            id="saveRepairBtn"
            onclick="saveRepair()"
        >

            儲存維修紀錄

        </button>

    </div>



    <hr class="divider">



    <!-- ==========================================
         歷史照片
    ========================================== -->

    <div class="history-title">

        您過去上傳的照片：

    </div>


    <div
        id="gallery"
        class="gallery"
    >

        正在讀取 LINE 身份中...

    </div>



    <hr class="divider">



    <!-- ==========================================
         新增參考照片
    ========================================== -->

    <div class="history-title">

        新增參考照片：

    </div>


    <input
        type="file"
        id="fileInput"
        accept="image/*"
    >


    <button
        id="uploadBtn"
        onclick="uploadPhoto()"
    >

        確認上傳照片

    </button>


    <div
        id="status"
        class="status">
    </div>


</div>



<script>


// =====================================================
// Google Apps Script API
// =====================================================

const GOOGLE_API_URL =
    "https://script.google.com/macros/s/AKfycbwsi-SWa-LZ_fc7gEjtNxkOSg-ZrkigDxol2SxfYD058epCl81ToMeAC4iXCTXAYFSb9Q/exec";


// =====================================================
// LINE LIFF ID
// =====================================================

const MY_LIFF_ID =
    "2011256691-2xjeJiKc";


// =====================================================
// LINE User ID
// =====================================================

let user_id = "";



// =====================================================
// 初始化 LIFF
// =====================================================

async function initLIFF() {

    const gallery =
        document.getElementById(
            "gallery"
        );


    try {

        gallery.innerText =
            "正在連線 LINE...";


        await liff.init({

            liffId:
                MY_LIFF_ID

        });


        console.log(
            "LIFF initialized"
        );


        // ---------------------------------------------
        // 尚未登入
        // ---------------------------------------------

        if (!liff.isLoggedIn()) {

            gallery.innerText =
                "正在開啟 LINE 登入...";


            liff.login({

                redirectUri:
                    window.location.href

            });


            return;

        }


        // ---------------------------------------------
        // 取得 LINE Profile
        // ---------------------------------------------

        const profile =
            await liff.getProfile();


        console.log(
            "LINE Profile:",
            profile
        );


        if (
            !profile ||
            !profile.userId
        ) {

            throw new Error(
                "無法取得 LINE User ID"
            );

        }


        user_id =
            profile.userId;


        console.log(
            "LINE User ID:",
            user_id
        );


        gallery.innerText =
            "正在讀取您的資料...";


        // ---------------------------------------------
        // 載入資料
        // ---------------------------------------------

        await loadCustomer();


        await fetchRepairHistory();


        await fetchHistoryPhotos(
            user_id
        );


        // ---------------------------------------------
        // 維修日期預設今天
        // ---------------------------------------------

        setTodayRepairDate();


    } catch (error) {

        console.error(
            "LIFF Error:",
            error
        );


        gallery.innerText =
            "LINE 身份讀取失敗：" +
            (
                error.message ||
                error
            );

    }

}



// =====================================================
// 維修日期預設今天
// =====================================================

function setTodayRepairDate() {

    const input =
        document.getElementById(
            "repairDate"
        );


    if (!input.value) {

        const now =
            new Date();


        const year =
            now.getFullYear();


        const month =
            String(
                now.getMonth() + 1
            ).padStart(
                2,
                "0"
            );


        const day =
            String(
                now.getDate()
            ).padStart(
                2,
                "0"
            );


        input.value =
            year +
            "-" +
            month +
            "-" +
            day;

    }

}



// =====================================================
// 讀取客戶資料
// =====================================================

async function loadCustomer() {

    try {

        const response =
            await fetch(

                GOOGLE_API_URL +
                "?action=getCustomer&userId=" +
                encodeURIComponent(
                    user_id
                )

            );


        const data =
            await response.json();


        console.log(
            "Customer:",
            data
        );


        if (
            data.status ===
                "success" &&
            data.customer
        ) {

            document.getElementById(
                "customerName"
            ).value =
                data.customer.name ||
                "";


            document.getElementById(
                "phone"
            ).value =
                data.customer.phone ||
                "";


            document.getElementById(
                "address"
            ).value =
                data.customer.address ||
                "";


            document.getElementById(
                "model"
            ).value =
                data.customer.model ||
                "";


            document.getElementById(
                "installDate"
            ).value =
                data.customer.installDate ||
                "";

        }


    } catch (error) {

        console.error(
            "載入客戶資料失敗:",
            error
        );

    }

}



// =====================================================
// 儲存客戶資料
// =====================================================

async function saveCustomer() {

    if (!user_id) {

        alert(
            "尚未取得 LINE 身份，請重新整理。"
        );

        return;

    }


    const name =
        document.getElementById(
            "customerName"
        ).value.trim();


    const phone =
        document.getElementById(
            "phone"
        ).value.trim();


    const address =
        document.getElementById(
            "address"
        ).value.trim();


    const model =
        document.getElementById(
            "model"
        ).value.trim();


    const installDate =
        document.getElementById(
            "installDate"
        ).value;


    if (!name) {

        alert(
            "請輸入姓名"
        );

        return;

    }


    const btn =
        document.getElementById(
            "saveCustomerBtn"
        );


    btn.disabled =
        true;


    btn.innerText =
        "儲存中...";


    try {

        const payload = {

            action:
                "saveCustomer",

            userId:
                user_id,

            name:
                name,

            phone:
                phone,

            address:
                address,

            model:
                model,

            installDate:
                installDate

        };


        const response =
            await fetch(

                GOOGLE_API_URL,

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify(
                            payload
                        )

                }

            );


        const data =
            await response.json();


        if (
            data.status ===
            "success"
        ) {

            alert(
                "客戶資料已成功儲存！"
            );

        } else {

            alert(
                "儲存失敗：" +
                (
                    data.message ||
                    ""
                )
            );

        }


    } catch (error) {

        console.error(
            error
        );


        alert(
            "無法連線到伺服器"
        );


    } finally {

        btn.disabled =
            false;


        btn.innerText =
            "儲存客戶資料";

    }

}



// =====================================================
// 讀取維修歷史
// =====================================================

async function fetchRepairHistory() {

    const container =
        document.getElementById(
            "repairHistory"
        );


    if (!user_id) {

        container.innerText =
            "尚未取得 LINE 身份";

        return;

    }


    try {

        container.innerText =
            "正在讀取維修紀錄...";


        const response =
            await fetch(

                GOOGLE_API_URL +
                "?action=getRepairs&userId=" +
                encodeURIComponent(
                    user_id
                )

            );


        const data =
            await response.json();


        console.log(
            "Repair History:",
            data
        );


        container.innerHTML =
            "";


        if (
            !data ||
            data.status !==
                "success" ||
            !data.repairs ||
            data.repairs.length === 0
        ) {

            container.innerHTML =
                '<div class="no-repair">' +
                '尚無維修歷史紀錄' +
                '</div>';

            return;

        }


        data.repairs.forEach(
            function(repair) {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "repair-card";


                // --------------------------------------
                // 維修日期
                // --------------------------------------

                const date =
                    document.createElement(
                        "div"
                    );


                date.className =
                    "repair-date";


                date.innerText =
                    "維修日期：" +
                    (
                        repair.repairDate ||
                        ""
                    );


                card.appendChild(
                    date
                );


                // --------------------------------------
                // 維修內容
                // --------------------------------------

                if (repair.content) {

                    const row =
                        document.createElement(
                            "div"
                        );


                    row.className =
                        "repair-row";


                    const label =
                        document.createElement(
                            "span"
                        );


                    label.className =
                        "repair-label";


                    label.innerText =
                        "維修內容：";


                    row.appendChild(
                        label
                    );


                    row.appendChild(
                        document.createTextNode(
                            " " +
                            repair.content
                        )
                    );


                    card.appendChild(
                        row
                    );

                }


                // --------------------------------------
                // 維修人員
                // --------------------------------------

                if (
                    repair.technician
                ) {

                    const row =
                        document.createElement(
                            "div"
                        );


                    row.className =
                        "repair-row";


                    const label =
                        document.createElement(
                            "span"
                        );


                    label.className =
                        "repair-label";


                    label.innerText =
                        "維修人員：";


                    row.appendChild(
                        label
                    );


                    row.appendChild(
                        document.createTextNode(
                            " " +
                            repair.technician
                        )
                    );


                    card.appendChild(
                        row
                    );

                }


                // --------------------------------------
                // 備註
                // --------------------------------------

                if (repair.note) {

                    const row =
                        document.createElement(
                            "div"
                        );


                    row.className =
                        "repair-row";


                    const label =
                        document.createElement(
                            "span"
                        );


                    label.className =
                        "repair-label";


                    label.innerText =
                        "備註：";


                    row.appendChild(
                        label
                    );


                    row.appendChild(
                        document.createTextNode(
                            " " +
                            repair.note
                        )
                    );


                    card.appendChild(
                        row
                    );

                }


                container.appendChild(
                    card
                );

            }
        );


    } catch (error) {

        console.error(
            "讀取維修紀錄失敗:",
            error
        );


        container.innerHTML =
            '<div class="no-repair">' +
            '無法載入維修紀錄' +
            '</div>';

    }

}



// =====================================================
// 儲存維修紀錄
// =====================================================

async function saveRepair() {

    if (!user_id) {

        alert(
            "尚未取得 LINE 身份，請重新整理。"
        );

        return;

    }


    const repairDate =
        document.getElementById(
            "repairDate"
        ).value;


    const content =
        document.getElementById(
            "repairContent"
        ).value.trim();


    const technician =
        document.getElementById(
            "technician"
        ).value.trim();


    const note =
        document.getElementById(
            "repairNote"
        ).value.trim();


    if (!repairDate) {

        alert(
            "請輸入維修日期"
        );

        return;

    }


    if (!content) {

        alert(
            "請輸入維修內容"
        );

        return;

    }


    const btn =
        document.getElementById(
            "saveRepairBtn"
        );


    btn.disabled =
        true;


    btn.innerText =
        "儲存中...";


    try {

        const payload = {

            action:
                "saveRepair",

            userId:
                user_id,

            repairDate:
                repairDate,

            content:
                content,

            technician:
                technician,

            note:
                note

        };


        const response =
            await fetch(

                GOOGLE_API_URL,

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify(
                            payload
                        )

                }

            );


        const data =
            await response.json();


        if (
            data.status ===
            "success"
        ) {

            alert(
                "維修紀錄已成功儲存！"
            );


            // ------------------------------------------
            // 清空輸入
            // ------------------------------------------

            document.getElementById(
                "repairContent"
            ).value =
                "";


            document.getElementById(
                "technician"
            ).value =
                "";


            document.getElementById(
                "repairNote"
            ).value =
                "";


            // ------------------------------------------
            // 重新載入維修歷史
            // ------------------------------------------

            await fetchRepairHistory();


        } else {

            alert(
                "儲存失敗：" +
                (
                    data.message ||
                    ""
                )
            );

        }


    } catch (error) {

        console.error(
            "儲存維修紀錄失敗:",
            error
        );


        alert(
            "無法連線到伺服器"
        );


    } finally {

        btn.disabled =
            false;


        btn.innerText =
            "儲存維修紀錄";

    }

}



// =====================================================
// 讀取歷史照片
// =====================================================

async function fetchHistoryPhotos(
    uid
) {

    const gallery =
        document.getElementById(
            "gallery"
        );


    try {

        const response =
            await fetch(

                GOOGLE_API_URL +
                "?action=getPhotos&userId=" +
                encodeURIComponent(
                    uid
                )

            );


        const data =
            await response.json();


        gallery.innerHTML =
            "";


        if (
            !data ||
            data.length === 0
        ) {

            gallery.innerText =
                "尚無歷史照片紀錄";

            return;

        }


        data.forEach(
            function(url) {

                const img =
                    document.createElement(
                        "img"
                    );


                img.src =
                    url;


                img.loading =
                    "lazy";


                gallery.appendChild(
                    img
                );

            }
        );


    } catch (error) {

        console.error(
            "讀取照片失敗:",
            error
        );


        gallery.innerText =
            "無法載入雲端相簿紀錄";

    }

}



// =====================================================
// 上傳照片
// =====================================================

function uploadPhoto() {

    const fileInput =
        document.getElementById(
            "fileInput"
        );


    if (
        fileInput.files.length === 0
    ) {

        alert(
            "請先選擇照片"
        );

        return;

    }


    if (!user_id) {

        alert(
            "尚未讀取到您的 LINE 帳號身份，請重新整理網頁"
        );

        return;

    }


    const file =
        fileInput.files[0];


    // -----------------------------------------------
    // 限制 10MB
    // -----------------------------------------------

    if (
        file.size >
        10 * 1024 * 1024
    ) {

        alert(
            "照片不能超過 10MB"
        );

        return;

    }


    const btn =
        document.getElementById(
            "uploadBtn"
        );


    btn.innerText =
        "照片上傳中...";


    btn.disabled =
        true;


    const reader =
        new FileReader();


    reader.readAsDataURL(
        file
    );


    reader.onload =
        function() {

            try {

                const base64Parts =
                    reader.result.split(
                        ","
                    );


                const base64String =
                    base64Parts[1];


                const payload = {

                    action:
                        "upload",

                    userId:
                        user_id,

                    filename:
                        file.name,

                    mimeType:
                        file.type,

                    data:
                        base64String

                };


                fetch(

                    GOOGLE_API_URL,

                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "text/plain;charset=utf-8"

                        },

                        body:
                            JSON.stringify(
                                payload
                            )

                    }

                )

                .then(
                    response =>
                        response.json()
                )

                .then(
                    function(data) {

                        if (
                            data.status ===
                            "success"
                        ) {

                            alert(
                                "上傳成功！"
                            );


                            // --------------------------------
                            // 重新載入照片
                            // --------------------------------

                            fetchHistoryPhotos(
                                user_id
                            );


                            fileInput.value =
                                "";

                        } else {

                            alert(
                                "上傳失敗：" +
                                (
                                    data.message ||
                                    ""
                                )
                            );

                        }


                        resetUploadButton();

                    }

                )

                .catch(
                    function(error) {

                        console.error(
                            error
                        );


                        alert(
                            "照片上傳失敗，請確認網路及 GAS 部署設定。"
                        );


                        resetUploadButton();

                    }
                );


            } catch (error) {

                console.error(
                    error
                );


                resetUploadButton();

            }

        };


    reader.onerror =
        function() {

            alert(
                "照片讀取失敗"
            );


            resetUploadButton();

        };

}



// =====================================================
// 重設照片上傳按鈕
// =====================================================

function resetUploadButton() {

    const btn =
        document.getElementById(
            "uploadBtn"
        );


    btn.innerText =
        "確認上傳照片";


    btn.disabled =
        false;

}



// =====================================================
// 啟動
// =====================================================

initLIFF();

</script>

</body>

</html>
